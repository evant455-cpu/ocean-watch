[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanwatch"
version = "0.1.0"
description = "Open-data ocean monitoring with Global Fishing Watch: fishing effort, radar detections, AIS gaps, and encounters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gfw-api-python-client>=1.4",
    "pandas>=2.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
oceanwatch = "oceanwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
